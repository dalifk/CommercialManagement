<!--
============================================
VUE: Formulaire Client
Permet de créer ou modifier un client
============================================
-->

<!-- Titre dynamique selon le mode -->
<h2>{{ isEditMode ? 'Modifier' : 'Créer' }} un Client</h2>

<!-- Formulaire -->
<form (ngSubmit)="onSubmit()">
    <!-- Nom (obligatoire) -->
    <div class="mb-3">
        <label class="form-label">Nom *</label>
        <input type="text" class="form-control" 
               [(ngModel)]="client.nom" 
               name="nom" required>
    </div>

    <!-- Prénom / Raison Sociale -->
    <div class="mb-3">
        <label class="form-label">Prénom / Raison Sociale</label>
        <input type="text" class="form-control" 
               [(ngModel)]="client['prénom_ou_raison_sociale']" 
               name="prenom">
    </div>

    <!-- Email (obligatoire) -->
    <div class="mb-3">
        <label class="form-label">Email *</label>
        <input type="email" class="form-control" 
               [(ngModel)]="client.email" 
               name="email" required>
    </div>

    <!-- Téléphone -->
    <div class="mb-3">
        <label class="form-label">Téléphone</label>
        <input type="text" class="form-control" 
               [(ngModel)]="client['téléphone']" 
               name="telephone">
    </div>

    <!-- Adresse -->
    <div class="mb-3">
        <label class="form-label">Adresse</label>
        <textarea class="form-control" 
                  [(ngModel)]="client.adresse" 
                  name="adresse" rows="2"></textarea>
    </div>

    <!-- Boutons d'action -->
    <div class="mb-3">
        <button type="submit" class="btn btn-primary">
            {{ isEditMode ? 'Mettre à jour' : 'Créer' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" 
                routerLink="/clients">
            Annuler
        </button>
    </div>
</form>
