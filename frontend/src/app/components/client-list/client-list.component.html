<!--
============================================
VUE: Liste des Clients
============================================
-->

<div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Liste des Clients</h2>
    <button class="btn btn-primary" routerLink="/clients/new">+ Nouveau Client</button>
</div>

<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nom</th>
                <th>Prénom/Raison Sociale</th>
                <th>Email</th>
                <th>Téléphone</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let client of clients">
                <td>{{ client.identifiant }}</td>
                <td>{{ client.nom }}</td>
                <!-- ✅ FIX: Notation entre crochets pour les caractères spéciaux -->
                <td>{{ client['prénom_ou_raison_sociale'] || '-' }}</td>
                <td>{{ client.email }}</td>
                <td>{{ client['téléphone'] || '-' }}</td>
                <td>
                    <button class="btn btn-sm btn-warning me-1" 
                            [routerLink]="['/clients/edit', client.identifiant]">✏️</button>
                    <button class="btn btn-sm btn-danger" 
                            (click)="deleteClient(client.identifiant)">🗑️</button>
                </td>
            </tr>
        </tbody>
    </table>
</div>

<div *ngIf="clients.length === 0" class="alert alert-info">
    Aucun client trouvé. Créez votre premier client !
</div>
